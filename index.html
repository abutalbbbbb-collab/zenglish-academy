let reviewQueue=[], reviewIndex=0, reviewRevealed=false;
function collectReviewWords(){
 const a=words.map(w=>({word:w.word,meaning:w.meaning,example:w.example,ep:1}));
 const b=words2.map(w=>({word:w.word,meaning:w.meaning,example:w.example,ep:2}));
 Object.entries(lessonData).forEach(([ep,d])=>d.words.forEach(w=>a.push({word:w[0],meaning:w[1],example:w[2],ep:+ep})));
 const seen=new Set();return [...a,...b].filter(x=>{let k=x.word.toLowerCase();if(seen.has(k))return false;seen.add(k);return true});
}
function reviewStore(){st.reviewCards=st.reviewCards||{};return st.reviewCards}
function reviewDueCount(){let now=Date.now(),cards=reviewStore();return collectReviewWords().filter(w=>!cards[w.word]||!cards[w.word].due||cards[w.word].due<=now).length}
function reviewView(){let all=collectReviewWords(),due=reviewDueCount(),saved=all.filter(w=>st.saved.includes(w.word)).length;document.getElementById('view').innerHTML=`<h2>المراجعة الذكية</h2><p class="muted">راجع الكلمات على فترات متباعدة حتى تثبت في الذاكرة. مواعيد المراجعة محفوظة على هذا الجهاز.</p><div class="grid"><div class="stat"><b>${all.length}</b><span class="muted">إجمالي الكلمات</span></div><div class="stat"><b>${due}</b><span class="muted">مستحقة للمراجعة الآن</span></div><div class="stat"><b>${saved}</b><span class="muted">كلمات محفوظة</span></div></div><div class="panel"><h3>ابدأ المراجعة</h3><p>سيعرض التطبيق المعنى العربي، وأنت تكتب الكلمة الإنجليزية ثم تكشف الإجابة وتحدد مدى سهولتها.</p><div class="row"><button class="btn primary" onclick="startReview('due')">مراجعة الكلمات المستحقة (${due})</button><button class="btn" onclick="startReview('all')">مراجعة كل الكلمات</button><button class="btn" onclick="startReview('saved')">مراجعة المحفوظة (${saved})</button></div></div><div class="notice">طريقة الجدولة: «صعبة» تعود بعد 10 دقائق، «جيدة» بعد يوم، و«سهلة» بعد 3 أيام. هذه مواعيد تنظيمية بسيطة وليست تقييماً علمياً لمستوى الحفظ.</div><div id="reviewSession"></div>`}
function startReview(mode){let all=collectReviewWords(),now=Date.now(),cards=reviewStore();reviewQueue=all.filter(w=>mode==='all'||(mode==='saved'?st.saved.includes(w.word):(!cards[w.word]||!cards[w.word].due||cards[w.word].due<=now)));reviewQueue.sort(()=>Math.random()-.5);reviewIndex=0;reviewRevealed=false;renderReviewCard()}
function renderReviewCard(){let box=document.getElementById('reviewSession');if(!box)return;if(!reviewQueue.length){box.innerHTML='<div class="panel"><b>لا توجد كلمات في هذه المجموعة.</b><p class="muted">جرّب مراجعة كل الكلمات أو احفظ كلمات من الدروس.</p></div>';return}if(reviewIndex>=reviewQueue.length){box.innerHTML=`<div class="panel"><h3>أحسنت! انتهت جلسة المراجعة 🎉</h3><p>راجعت ${reviewQueue.length} كلمة.</p><button class="btn primary" onclick="reviewView()">العودة للمراجعة</button></div>`;return}let w=reviewQueue[reviewIndex];box.innerHTML=`<div class="panel"><div class="row"><span class="tag">الحلقة ${w.ep}</span><span class="muted">${reviewIndex+1} من ${reviewQueue.length}</span></div><h2>${w.meaning}</h2><input id="reviewInput" type="text" dir="ltr" placeholder="Type the English word..." autocomplete="off" onkeydown="if(event.key==='Enter')revealReview()"><button class="btn primary" onclick="revealReview()">تحقق / أظهر الإجابة</button><div id="reviewAnswer" class="feedback"></div><div id="reviewRatings" style="display:none;margin-top:12px" class="row"><button class="btn" onclick="rateReview('hard')">صعبة · 10 دقائق</button><button class="btn primary" onclick="rateReview('good')">جيدة · يوم</button><button class="btn" onclick="rateReview('easy')">سهلة · 3 أيام</button></div></div>`}
function revealReview(){if(!reviewQueue.length)return;let w=reviewQueue[reviewIndex],v=(document.getElementById('reviewInput').value||'').trim().toLowerCase(),correct=w.word.trim().toLowerCase();let box=document.getElementById('reviewAnswer');box.innerHTML=`${v===correct&&v?'✓ إجابة صحيحة!':'الإجابة الصحيحة:'} <b dir="ltr">${w.word}</b><div class="muted" dir="ltr">${w.example||''}</div>`;box.style.color=v===correct&&v?'var(--g)':'var(--n)';document.getElementById('reviewRatings').style.display='flex';reviewRevealed=true}
function rateReview(level){if(!reviewQueue.length)return;let w=reviewQueue[reviewIndex],minutes=level==='hard'?10:level==='good'?1440:4320,cards=reviewStore();cards[w.word]={due:Date.now()+minutes*60000,last:Date.now(),level};save();reviewIndex++;reviewRevealed=false;renderReviewCard()}

const sentencePosition={};
const sentenceAnswers={};
function sentenceList(n){
 const d=lessonData[n];
 return d.words.map((w,i)=>({text:String(w[2]||'').trim(),source:i})).filter(x=>/[.!?]$/.test(x.text)&&x.text.split(/\s+/).filter(Boolean).length>=3&&x.text.split(/\s+/).length<=14);
}
function sentenceTokens(n){const list=sentenceList(n);if(!list.length)return null;const pos=(sentencePosition[n]||0)%list.length;const original=list[pos].text.replace(/[.!?]+$/,'').split(/\s+/);let bank=original.map((word,i)=>({word,id:i}));bank.sort(()=>Math.random()-.5);return {pos,original,bank};}
function renderSentence(n){const list=sentenceList(n);const area=document.getElementById('sentenceExercise');if(!area)return;if(!list.length){area.innerHTML='<p class="muted">لا توجد جمل كاملة مناسبة لهذا التمرين في أمثلة هذه الحلقة.</p>';return}const pos=(sentencePosition[n]||0)%list.length;const original=list[pos].text.replace(/[.!?]+$/,'').split(/\s+/);let bank=original.map((word,i)=>({word,id:i}));bank.sort(()=>Math.random()-.5);sentenceAnswers[n]=[];area.innerHTML=`<div class="muted">الجملة ${pos+1} من ${list.length}</div><p>رتّب الكلمات لتكوين جملة صحيحة:</p><div class="sentence-bank">${bank.map(x=>`<button class="btn" onclick="chooseSentenceWord(${n},${x.id})">${x.word}</button>`).join(' ')}</div><p class="muted">إجابتك:</p><div id="sentenceChosen" class="sentence-chosen">اضغط الكلمات بالترتيب الصحيح</div><div class="row"><button class="btn primary" onclick="checkSentence(${n})">تحقق</button><button class="btn" onclick="resetSentence(${n})">إعادة المحاولة</button><button class="btn" onclick="nextSentence(${n})">الجملة التالية</button><button class="btn" onclick="showSentence(${n})">إظهار الحل</button></div><div id="sentenceFeedback" class="feedback"></div>`;sentenceAnswers[n]=[];sentenceBank[n]=bank;}
const sentenceBank={};
function chooseSentenceWord(n,id){const list=sentenceList(n),pos=(sentencePosition[n]||0)%list.length,chosen=sentenceAnswers[n]||[];if(chosen.includes(id))return;chosen.push(id);sentenceAnswers[n]=chosen;const item=sentenceBank[n].find(x=>x.id===id);document.getElementById('sentenceChosen').textContent=chosen.map(k=>sentenceBank[n].find(x=>x.id===k).word).join(' ');}

function checkSentence(n){const list=sentenceList(n),pos=(sentencePosition[n]||0)%list.length,correct=list[pos].text.replace(/[.!?]+$/,'').split(/\s+/),chosen=sentenceAnswers[n]||[],box=document.getElementById('sentenceFeedback');if(chosen.length!==correct.length){box.textContent='أكمل اختيار جميع الكلمات أولاً.';return}const answer=chosen.map(id=>sentenceBank[n].find(x=>x.id===id).word);if(answer.join(' ').toLowerCase()===correct.join(' ').toLowerCase()){box.textContent='✓ ممتاز! رتبت الجملة بشكل صحيح.';box.style.color='var(--g)';const key='sentenceXP'+n;st[key]=st[key]||[];if(!st[key].includes(pos)){st[key].push(pos);st.xp+=3;save()}}else{box.textContent='ليس الترتيب الصحيح بعد. جرّب إعادة المحاولة.';box.style.color='#b45309'}}

 if(!('speechSynthesis' in window)){alert('المتصفح لا يدعم تشغيل النطق الصوتي. جرّب Chrome.');return}
 window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=0.82;u.pitch=1;window.speechSynthesis.speak(u);
}

function checkListen(n){const expected=currentListenSentence(n).toLowerCase().replace(/[.!?,]/g,'').replace(/\s+/g,' ').trim();const given=document.getElementById('listenAnswer').value.toLowerCase().replace(/[.!?,]/g,'').replace(/\s+/g,' ').trim();const box=document.getElementById('listenFeedback');if(!given){box.textContent='اكتب ما سمعته أولاً.';return}if(given===expected){box.textContent='✓ ممتاز! كتبت الجملة بشكل صحيح.';box.style.color='var(--g)';const key='listenXP'+n;st[key]=st[key]||[];const pos=sentencePosition[n]||0;if(!st[key].includes(pos)){st[key].push(pos);st.xp+=2;save()}}else{box.textContent='ليست مطابقة تماماً. أعد الاستماع وحاول مرة أخرى.';box.style.color='#b45309'}}
function startSpeaking(n){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const box=document.getElementById('speakFeedback');if(!SR){box.textContent='ميزة التعرف على الصوت غير مدعومة في هذا المتصفح. استخدم Chrome أو جرّب التدريب الصوتي بالاستماع.';return}const target=lessonData[n].words[(practicePosition[n]||0)%lessonData[n].words.length][0];const rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=3;box.textContent='تحدث الآن بالإنجليزية واسمح للمتصفح باستخدام الميكروفون...';rec.onresult=e=>{const heard=e.results[0][0].transcript;const norm=x=>x.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();box.textContent='سمعت: '+heard+' — '+(norm(heard)===norm(target)?'✓ نطق/تعرف صحيح للكلمة!':'حاول مرة أخرى. الكلمة المطلوبة: '+target);box.style.color=norm(heard)===norm(target)?'var(--g)':'#b45309'};rec.onerror=e=>{box.textContent='تعذر استخدام الميكروفون ('+e.error+'). تحقق من إذن الميكروفون واتصال الصفحة.'};rec.start()}

function renderGenericQuiz(n){const d=lessonData[n];document.getElementById('gquiz').innerHTML=d.quiz.map((q,i)=>`<div class="question"><b>${i+1}. ${q[0]}</b>${q[1].map((a,j)=>`<label class="choice"><input type="radio" name="g${n}_${i}" value="${j}"> ${a}</label>`).join('')}</div>`).join('')}
function gradeGeneric(n){const d=lessonData[n];let score=0;d.quiz.forEach((q,i)=>{const a=document.querySelector(`input[name="g${n}_${i}"]:checked`);if(a&&+a.value===q[2])score++});genericPassed[n]=score>=4;document.getElementById('gresult').textContent=`نتيجتك ${score}/5 — ${genericPassed[n]?'أحسنت، اجتزت الاختبار':'أعد المحاولة حتى تحصل على 4/5 على الأقل'}`;const key='awarded'+n;if(genericPassed[n]&&!st[key]){st.xp+=20;st[key]=true;save()}}
function completeGeneric(n){if(!genericPassed[n]){document.getElementById('gcomplete').textContent=' اجتز الاختبار أولاً.';return}if(!st.done.includes(n)){st.done.push(n);st.xp+=30}save();document.getElementById('gcomplete').textContent=' تم تسجيل الحلقة كمكتملة.'}
function saveGenericWord(n,i){const w=lessonData[n].words[i][0];if(!st.saved.includes(w))st.saved.push(w);save();episodeGeneric(n)}

let deferredInstallPrompt = null;
const installBtn = document.getElementById('installBtn');
const installHelp = document.getElementById('installHelp');
const installHelpBtn = document.getElementById('installHelpBtn');

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  if (installBtn) installBtn.hidden = false;
  if (installHelp) installHelp.textContent = 'التطبيق جاهز للتثبيت على هذا الجهاز.';
});
if (installBtn) {
  installBtn.addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installBtn.hidden = true;
  });
}
if (installHelpBtn) {
  installHelpBtn.addEventListener('click', () => {
    const ua = navigator.userAgent || '';
    let msg = 'افتح رابط التطبيق المنشور على الإنترنت في Chrome، ثم افتح القائمة ⋮ واختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».';

  });
}
